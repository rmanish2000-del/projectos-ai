[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projectos"
version = "0.1.0"
description = "ProjectOS AI — repository-driven orchestration kernel (v0.1 core)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Manish", email = "rmanish2000@gmail.com" }]
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.21",
    # PEP 440 version parsing for pack compatibility checks (spec 10).
    "packaging>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
projectos = "projectos.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
projectos = ["infrastructure/schemas/*.json", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ANN", "PT"]
# N818 wants every exception named *Error. The kernel's error vocabulary mirrors
# the specification's language (InvariantViolation, EscalationRequired,
# AuditChainBroken); renaming them to *Error would obscure what each one means.
ignore = ["ANN401", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["projectos"]
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = "jsonschema.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

name: Restocker gate

on:
  pull_request:
    paths:
      - "src/projectos/infrastructure/chat_auto_restock.py"
      - "tests/test_chat_auto_restock.py"
      - "scripts/wake.ps1"
      - "docs/wake/chat-restock-config.json"
      - ".github/workflows/restocker-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest -q

  windows-task-scheduler:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Invoke deterministic restocker through Task Scheduler
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $reports = Join-Path $env:RUNNER_TEMP "restock-reports"
          New-Item -ItemType Directory -Force -Path $reports | Out-Null
          $task = "ProjectOS-Restocker-Gate-$env:GITHUB_RUN_ID"
          $script = Join-Path $env:GITHUB_WORKSPACE "scripts\wake.ps1"
          $command = "powershell -NoProfile -ExecutionPolicy Bypass -File `"$script`" -RepoRoot `"$env:GITHUB_WORKSPACE`" -Seat CHAT-AUTO-RESTOCK -ReportsDir `"$reports`""
          try {
            schtasks /Create /TN $task /TR $command /SC ONCE /ST 23:59 /F | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "Task creation failed: $LASTEXITCODE" }
            schtasks /Run /TN $task | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "Task start failed: $LASTEXITCODE" }
            $deadline = (Get-Date).AddSeconds(60)
            do {
              Start-Sleep -Seconds 2
              $pass = Get-ChildItem $reports -Filter "*_CHAT-AUTO-RESTOCK_PASS.md" -ErrorAction SilentlyContinue
              $failure = Get-ChildItem $reports -Filter "*_CHAT-AUTO-RESTOCK_WAKE-FAILURE.md" -ErrorAction SilentlyContinue
              if ($failure) { throw "Scheduled restocker wrote WAKE-FAILURE" }
            } until ($pass -or (Get-Date) -ge $deadline)
            if (-not $pass) { throw "Scheduled restocker produced no PASS report" }
            Get-Content $pass.FullName
          }
          finally {
            schtasks /Delete /TN $task /F 2>$null | Out-Null
          }

name: outreach-reply-watcher

on:
  schedule:
    # Every 30 minutes — 14 public reads/hour, under unauthenticated 60/hour limit
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      proof_force_comment_id:
        description: "Optional comment id to force-treat as new (acceptance proof)"
        required: false
        type: string

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Poll threads and open reply issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROOF_FORCE_COMMENT_ID: ${{ inputs.proof_force_comment_id }}
        run: python3 scripts/outreach_watch.py

      - name: Persist seen-comment state
        run: |
          if git diff --quiet -- state/outreach-seen.json; then
            echo "No state change"
            exit 0
          fi
          git config user.name "projectos-outreach-watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/outreach-seen.json
          git commit -m "chore(outreach): update seen-comment state"
          git push

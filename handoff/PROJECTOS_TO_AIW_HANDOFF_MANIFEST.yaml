# ---- CR-1 SEEDED DATA (explicitly EXCLUDED) -----------------------------------
cr1_seed:
  status: SEED_UNVERIFIED
  present_in_this_handoff: false
  present_in_projectos_repo: false     # verified: no seed/registry-record file exists on disk
  rule: >
    Seeded capability records are DATA, not specification. They are NOT included in this
    handoff and must NOT be imported into any AI Workspace registry until verified by the
    B3 assignment (see B3_SEED_VERIFICATION_CONTRACT.md). CR-1 SPECIFICATION lives inside
    PO-7; CR-1 DATA does not exist here and may not be invented.

# ---- HANDOFF CLASSIFICATION (how AIW consumes each) ---------------------------
handoff_classification:
  default: VENDORED_SNAPSHOT   # AIW stores a pinned, hash-verified copy; ProjectOS remains upstream source of truth
  all_documents: VENDORED_SNAPSHOT
  cr1_seed: EXCLUDED_PENDING_B3_VERIFICATION
  precedence: >
    Source-of-truth precedence: ProjectOS repo (upstream) > AIW vendored snapshot (downstream).
    On hash drift, ProjectOS wins and AIW re-vendors. Downloads / conversation history /
    any unverified location are NEVER source of truth.

# PROJECTOS → AI WORKSPACE — Canonical Corpus Handoff Manifest
# Deterministic, provenance-bearing inventory of every corpus document AI Workspace
# requires. Machine-readable source of truth for the handoff. Entries sorted by document_id.
#
# HASHES ARE REAL: computed SHA-256 over the actual committed files in the ProjectOS
# repository (C:\ProjectOS-AI). Re-verify with: sha256sum <file>.
#
# STATUS IS HONEST: ratification (PO-11) has NOT been executed. Nothing here is
# "ratified". The design corpus is PROPOSED_CANONICAL (pending PO-10 sign-off).
# No source is elevated merely because it is complete.

manifest:
  schema_version: 1
  name: projectos-to-aiw-corpus-handoff
  corpus_version: "Foundational Corpus v1.0 (PROPOSED — not ratified)"
  hash_algorithm: sha256
  upstream_source_of_truth: "ProjectOS repository (C:\\ProjectOS-AI)"
  ratification_state: NOT_EXECUTED   # PO-10 approval + PO-11 run both pending
  downloads_is_canonical: false      # constraint: Downloads is never a canonical repository
  generated_by: "PO-12 (Claude Cowork, Lane B)"
  notes: >
    Every entry references an actual file by path + SHA-256. Consumers MUST verify the
    hash before use (integrity check). Status reflects GOVERNANCE/ratification state, not
    completeness. build_status is a separate axis (implemented vs spec).

# ---- STATUS VOCABULARY (closed set) -------------------------------------------
status_vocabulary:
  PROPOSED_CANONICAL: "Authored, internally consistent, awaiting PO-10 sign-off + PO-11 execution. Safe to DESIGN against; may NOT be cited as ratified."
  REFERENCE:          "Informational finding of fact; non-binding (Constitution T3)."
  GOVERNANCE_INSTRUMENT: "Process/approval document (proposed); not a design input to implement against."
  SEED_UNVERIFIED:    "Data records requiring repository verification (B3) before any use. NOT included in this handoff."
  HELD:               "Explicitly deferred; remains held. Not for use."

